[project]
name = "pyunto-agent"
version = "0.1.6"
description = "Make an external agent (Claude, Claude Code, any CLI/HTTP agent) the partner of a Pyunto exchange diary"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Utagoe Inc." }]
keywords = ["pyunto", "diary", "agent", "ai-agent", "e2ee", "mcp", "mcp-server", "claude", "llm", "robotics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "requests>=2.31",
    "python-socketio[client]>=5.16",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Terminal QR for agent-initiated pairing. Optional: a headless agent in CI never shows one,
# and a hard requirement would make every install pay for a path most runs do not take.
qr = ["qrcode>=7.4"]

[project.urls]
Homepage = "https://pyunto.com"
Repository = "https://github.com/utagoeinc/pyunto-agent"
Issues = "https://github.com/utagoeinc/pyunto-agent/issues"
Documentation = "https://github.com/utagoeinc/pyunto-agent/blob/main/GUIDE.md"

[project.scripts]
pyunto-agent = "pyunto_agent.cli:main"

[build-system]
# 77+: PEP 639 SPDX `license` string and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyunto_agent*"]
