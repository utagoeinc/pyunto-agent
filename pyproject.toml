[project]
name = "pyunto-agent"
version = "0.3.0"
description = "Make an external agent (Claude, Claude Code, any CLI/HTTP agent) the partner of a Pyunto exchange diary"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Utagoe Inc." }]
keywords = ["pyunto", "diary", "agent", "ai-agent", "e2ee", "mcp", "mcp-server", "claude", "llm", "robotics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "requests>=2.31",
    "python-socketio[client]>=5.16",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    # Pairing is how every agent gets into a diary, including one started by an MCP client
    # from the registry (`uvx pyunto-agent mcp`), which installs no extras. So the QR code is
    # part of the base install: qrcode and pypng are small and pure Python.
    "qrcode>=7.4",
    "pypng>=0.20220715",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Kept so `pip install pyunto-agent[qr]` from older instructions still works; QR is now built in.
qr = []
# Reading attached documents for models that cannot open them directly: Word, Excel,
# PowerPoint and PDF text, and Pillow to convert HEIC / oversized photos. Plain text, images,
# PDFs sent to the Claude API, and anything Claude Code opens itself need none of these.
docs = ["python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0", "pypdf>=4.0", "pillow>=10.0"]

[project.urls]
Homepage = "https://pyunto.com"
Repository = "https://github.com/utagoeinc/pyunto-agent"
Issues = "https://github.com/utagoeinc/pyunto-agent/issues"
Documentation = "https://github.com/utagoeinc/pyunto-agent/blob/main/GUIDE.md"

[project.scripts]
pyunto-agent = "pyunto_agent.cli:main"

[build-system]
# 77+: PEP 639 SPDX `license` string and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyunto_agent*"]
